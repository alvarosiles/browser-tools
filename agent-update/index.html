<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>IT Support Tools — Actualizar agente</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #020617;
    --panel: #0f172a;
    --border: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-text: #eff6ff;
    --ok: #22c55e;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 2.5rem 1.25rem;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0 0 2rem; }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-bottom: 1rem; }
  td { padding: 0.4rem 0; border-bottom: 1px solid var(--border); }
  td:first-child { color: var(--muted); width: 40%; }
  td:last-child { text-align: right; }
  tr:last-child td { border-bottom: none; }
  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 0.5rem;
    padding: 0.65rem 1.1rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { background: #2563eb; }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
  #status { margin-top: 1rem; font-size: 0.85rem; }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--bad); }
  a.back { color: #60a5fa; text-decoration: none; font-size: 0.85rem; }
  a.back:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Actualizar agente local</h1>
  <p class="subtitle">Fuerza el chequeo de actualización ya mismo en esta PC, sin esperar el ciclo automático (cada 6hs).</p>

  <section>
    <table id="table"></table>
    <button class="primary" id="btn" onclick="update()">Chequear y actualizar ahora</button>
    <div id="status"></div>
  </section>

  <a class="back" href="../admin/">← Instaladores</a>
</main>

<script>
  const CONTROL = 'http://localhost:5178'

  function row(label, value) {
    return `<tr><td>${label}</td><td>${value ?? '—'}</td></tr>`
  }

  async function loadVersion() {
    const table = document.getElementById('table')
    try {
      const res = await fetch(`${CONTROL}/version`, { signal: AbortSignal.timeout(2500) })
      if (!res.ok) throw new Error()
      const data = await res.json()
      table.innerHTML = row('Versión actual', data.version) + row('Instalado como binario', data.isSea ? 'Sí' : 'No (modo desarrollo)')
      return data
    } catch {
      table.innerHTML = row('Estado', 'El agente no responde en esta PC.')
      return null
    }
  }

  async function update() {
    const btn = document.getElementById('btn')
    const status = document.getElementById('status')
    btn.disabled = true
    status.className = ''
    status.textContent = 'Chequeando...'

    try {
      const res = await fetch(`${CONTROL}/update-now`, { method: 'POST', signal: AbortSignal.timeout(4000) })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || 'El agente respondió con error.')

      status.className = 'ok'
      status.textContent = 'Chequeo iniciado. Si hay una versión nueva, el agente se va a actualizar y reiniciar solo en los próximos segundos — esta página va a dejar de responder un instante mientras eso pasa.'

      setTimeout(async () => {
        await loadVersion()
        status.textContent += ' Listo, verificá la versión de arriba.'
      }, 6000)
    } catch (err) {
      status.className = 'bad'
      status.textContent = err.message
    } finally {
      btn.disabled = false
    }
  }

  loadVersion()
</script>
</body>
</html>
